name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build database package
        run: pnpm --filter @interview-os/database build

      - name: Test API
        run: pnpm --filter api test

      - name: Build workspace
        run: pnpm build

  deploy-worker:
    name: Deploy Execution Worker
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AZURE_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/azure_deploy
          chmod 600 ~/.ssh/azure_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy worker to Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh -i ~/.ssh/azure_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          # Make Node.js and PM2 available in non-interactive SSH sessions.
          export NVM_DIR="/home/azureuser/.nvm"
          export PATH="$NVM_DIR/versions/node/v24.22.0/bin:$PATH"

          # Fail early if the deployment environment is incorrect.
          echo "Node: $(command -v node)"
          echo "PM2:  $(command -v pm2)"
          node --version
          pm2 --version

          cd /home/azureuser/InterviewOS

          echo "Updating main..."
          git fetch origin main
          git switch main
          git pull --ff-only origin main

          corepack pnpm install --frozen-lockfile
          corepack pnpm exec turbo run build --filter=./apps/workers/execution...

          echo "Restarting worker..."
          pm2 restart execution-worker --update-env
          sleep 5

          node -e '
            const { execFileSync } = require("node:child_process");
            const list = JSON.parse(execFileSync("pm2", ["jlist"], { encoding: "utf8" }));
            const worker = list.find(p => p.name === "execution-worker");
            if (!worker || worker.pm2_env.status !== "online") {
              console.error("ERROR: execution-worker is not online");
              process.exit(1);
            }
            console.log("SUCCESS: execution-worker is online");
          '

          pm2 save
          echo "Deployment finished successfully."
          REMOTE
